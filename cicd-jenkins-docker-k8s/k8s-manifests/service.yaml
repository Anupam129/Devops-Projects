apiVersion: v1
kind: Service
metadata:
  name: my-app-service        # Service name
  labels:
    app: my-app
spec:
  type: ClusterIP             # Or NodePort / LoadBalancer
  selector:
    app: my-app               # Must match labels in Deployment pods
  ports:
    - name: http
      port: 80                # Service port (inside cluster)
      targetPort: 8080        # Container port from deployment
      protocol: TCP
